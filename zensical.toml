[project]
  edit_uri  = "edit/staging/docs/"
  repo_name = "Los-Come-Tuani/api"
  repo_url  = "https://github.com/Los-Come-Tuani/api"

  extra_css = [
    "stylesheets/theme.css",
    "stylesheets/width.css",
  ]

  extra_javascript = [
    "scripts/elk.mjs",
  ]

  site_author      = "Joaquín Zúñiga"
  site_description = "Microservicios para la aplicación móvil K'Plan."
  site_name        = "api-docs"

  nav = [
    { "Inicio" = "index.md" },
    "guia.md",
    {
      "Requerimientos" = [
        "requerimientos/index.md",
        {
          "Funcionales" = [
            "requerimientos/funcionales/plataforma.md",
            "requerimientos/funcionales/app-turista.md",
            "requerimientos/funcionales/app-prestadores.md",
            "requerimientos/funcionales/portal-comercios.md",
            "requerimientos/funcionales/portal-alcaldias.md",
            "requerimientos/funcionales/portal-instituciones.md",
            "requerimientos/funcionales/backoffice.md",
          ],
        },
        "requerimientos/no-funcionales.md",
      ],
    },
    {
      "Actores del sistema" = [
        "actores/index.md",
        "actores/app-movil.md",
        "actores/portales.md",
        "actores/backoffice.md",
      ],
    },
    {
      "Modelo de dominio" = [
        "modelo-dominio/index.md",
        "modelo-dominio/decisiones.md",
        "modelo-dominio/convenciones.md",
      ],
    },
    {
      "Diagramas entidad-relación" = [
        "diagramas/entidad-relacion/index.md",
        {
          "Modelo conceptual" = [
            "diagramas/entidad-relacion/conceptual/catalogos.md",
            "diagramas/entidad-relacion/conceptual/identidad.md",
            "diagramas/entidad-relacion/conceptual/roles.md",
            "diagramas/entidad-relacion/conceptual/perfiles.md",
            "diagramas/entidad-relacion/conceptual/territorio.md",
            "diagramas/entidad-relacion/conceptual/itinerarios.md",
            "diagramas/entidad-relacion/conceptual/organizaciones.md",
            "diagramas/entidad-relacion/conceptual/agenda.md",
            "diagramas/entidad-relacion/conceptual/servicios.md",
            "diagramas/entidad-relacion/conceptual/mensajeria.md",
            "diagramas/entidad-relacion/conceptual/reputacion.md",
            "diagramas/entidad-relacion/conceptual/insignias.md",
            "diagramas/entidad-relacion/conceptual/finanzas.md",
            "diagramas/entidad-relacion/conceptual/moderacion.md",
            "diagramas/entidad-relacion/conceptual/notificaciones.md",
            "diagramas/entidad-relacion/conceptual/auditoria.md",
          ],
        },
        {
          "Modelo físico" = [
            "diagramas/entidad-relacion/fisico/catalogos.md",
            "diagramas/entidad-relacion/fisico/identidad.md",
            "diagramas/entidad-relacion/fisico/roles.md",
            "diagramas/entidad-relacion/fisico/perfiles.md",
            "diagramas/entidad-relacion/fisico/territorio.md",
            "diagramas/entidad-relacion/fisico/itinerarios.md",
          ],
        },
      ],
    },
    {
      "Diagramas de estados" = [
        "diagramas/estados/index.md",
        {
          "Entidades" = [
            "diagramas/estados/cuenta.md",
            "diagramas/estados/prestador.md",
            "diagramas/estados/circuito.md",
            "diagramas/estados/itinerario.md",
            "diagramas/estados/convocatoria.md",
            "diagramas/estados/reserva.md",
            "diagramas/estados/cupon.md",
            "diagramas/estados/evento.md",
          ],
        },
        {
          "Eventos" = [
            "diagramas/estados/verificacion.md",
            "diagramas/estados/sancion.md",
            "diagramas/estados/aviso.md",
          ],
        },
      ],
    },
  ]

  [project.markdown_extensions]
    abbr       = {}
    admonition = {}
    attr_list  = {}
    def_list   = {}
    md_in_html = {}
    tables     = {}

    toc = {
      permalink = true,
      toc_depth = 3,
    }

    [project.markdown_extensions.pymdownx]
      blocks.caption = {}
      caret          = {}
      details        = {}
      emoji          = {}
      highlight      = {}
      keys           = {}
      mark           = {}
      tilde          = {}

      tasklist.custom_checkbox = true

      snippets.auto_append = [
        "docs/snippets/abbrs.md",
        "docs/snippets/links.md",
      ]

      superfences.custom_fences = [
        {
          name   = "mermaid",
          class  = "mermaid",
          format = "pymdownx.superfences.fence_code_format",
        },
      ]

      [project.markdown_extensions.pymdownx.tabbed]
        alternate_style = true

        slugify = {
          kwds.case = "lower",
          object    = "pymdownx.slugs.slugify",
        }

  [project.theme]
    features = [
      "content.code.copy",
      "content.tooltips",
      "navigation.footer",
      "navigation.indexes",
      "navigation.instant",
      "navigation.instant.prefetch",
      "navigation.instant.progress",
      "navigation.path",
      "navigation.pruning",
      "navigation.sections",
      "navigation.tabs",
      "navigation.tabs.sticky",
      "navigation.top",
    ]

    favicon  = "favicon.svg"
    language = "es"
    logo     = "logo.svg"
    variant  = "modern"

    [[project.theme.palette]]
      accent      = "custom"
      media       = "(prefers-color-scheme: light)"
      primary     = "custom"
      scheme      = "default"
      toggle.icon = "lucide/sun"
      toggle.name = "Ir a modo oscuro"

    [[project.theme.palette]]
      accent      = "custom"
      media       = "(prefers-color-scheme: dark)"
      primary     = "custom"
      scheme      = "slate"
      toggle.icon = "lucide/moon"
      toggle.name = "Ir a modo claro"

  [project.validation]
    invalid_link_anchors  = false
    invalid_links         = false
    shadowed_definitions  = false
    shadowed_footnotes    = false
    unresolved_footnotes  = false
    unresolved_references = false
    unused_definitions    = false
    unused_footnotes      = false
