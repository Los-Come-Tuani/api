    "polyfactory>=3.0.0",
    "prek>=0.4.0",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.0.0",
    "pytest>=9.0.0",
    "rstr>=3.0.0",
    "ruff>=0.16.0",
    "schemathesis>=4.0.0",
