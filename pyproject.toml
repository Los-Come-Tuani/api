[project]
  authors = [
    { name = "Joaquín Zúñiga", email = "jp.zuniga.dev@gmail.com" },
  ]

  dependencies = [
    "django-cors-headers>=4.0.0",
    "django-filter>=26.0",
    "django-health-check>=4.0.0",
    "django-modern-rest[jwt,msgspec,openapi,pydantic]>=0.12.0",
    "django-pgbulk>=3.0.0",
    "django-pghistory>=3.0.0",
    "django-pglock>=1.0.0",
    "django-pgtransaction>=2.0.0",
    "django-pgtrigger>=4.0.0",
    "django>=6.0.0",
    "granian>=2.0.0",
    "phonenumbers>=9.0.0",
    "psycopg[binary,pool]>=3.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "redis[hiredis]>=8.0.0",
