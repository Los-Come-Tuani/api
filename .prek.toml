[[repos]]
  repo = "builtin"

  [[repos.hooks]]
    id = "check-added-large-files"

  [[repos.hooks]]
    id = "check-case-conflict"

  [[repos.hooks]]
    id = "check-illegal-windows-names"

  [[repos.hooks]]
    id = "check-merge-conflict"

  [[repos.hooks]]
    id = "check-json"

  [[repos.hooks]]
    id = "check-toml"

  [[repos.hooks]]
    id = "check-yaml"

  [[repos.hooks]]
    id = "detect-private-key"

  [[repos.hooks]]
    id = "end-of-file-fixer"

  [[repos.hooks]]
    args = ["--fix", "lf"]
    id   = "mixed-line-ending"

  [[repos.hooks]]
    args = ["--branch", "production"]
    id   = "no-commit-to-branch"

  [[repos.hooks]]
    args = ["--autofix"]
    id   = "pretty-format-json"

  [[repos.hooks]]
    id = "trailing-whitespace"

[[repos]]
  repo = "https://github.com/gitleaks/gitleaks"
  rev  = "v8.30.1"

  # escanea lo que está por commitearse (toma `.gitleaks.toml` de la raíz); la
  # historia completa se revisa en CI (`.github/workflows/secrets.yml`).
  [[repos.hooks]]
    id = "gitleaks"

[[repos]]
  repo = "local"

  [[repos.hooks]]
    entry          = "just pre-commit"
    files          = { glob = "src/**/*.py" }
    id             = "just-pre-commit"
    language       = "system"
    name           = "just-pre-commit"
    pass_filenames = false
    priority       = 100
