# Proxy inverso del contenedor de Azure App Service: Nginx es lo único que escucha hacia
# fuera (8080, el `WEBSITES_PORT`) y el API queda en 127.0.0.1:8000. Corre sin root, por
# eso el pid y los temporales van en /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server_tokens off;
    client_max_body_size 3m;

    server {
        listen 8080 default_server;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;

            # App Service termina el HTTPS y manda el protocolo y la IP del cliente; se
            # reenvían tal cual: el límite de peticiones del API usa la última IP de
            # `X-Forwarded-For`, y agregarle la de Nginx juntaría a todos en un solo cupo
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        }
    }
}
