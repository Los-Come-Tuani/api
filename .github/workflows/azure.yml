name: deploy to azure web app - kplan

on:
  push:
    branches: ["production"]
  workflow_dispatch:

env:
  IMAGE: docker.io/jpzunigadev/kplan-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: setup buildx
        uses: docker/setup-buildx-action@v4

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          target: runtime-azure
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=kplanapi-azure
          cache-to: type=gha,mode=max,scope=kplanapi-azure

      - name: deploy to azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: "kplan"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4AE80A6822C44E7EB53A50603913BF05 }}
          images: ${{ env.IMAGE }}:${{ github.sha }}
