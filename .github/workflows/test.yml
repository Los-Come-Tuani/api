name: test

on:
  push:
    branches-ignore:
      - "chore/deps"
      - "dependabot/**"
      - "**docs**"
  pull_request:
  workflow_dispatch:

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: setup tools
        uses: ./.github/actions/setup-tools

      - name: setup django env
        uses: ./.github/actions/setup-django-env

      - name: setup services
        uses: ./.github/actions/setup-services

      - name: run tests
        run: uv run --frozen pytest --maxfail 1
