name: secrets

on:
  push:
    branches-ignore:
      - "chore/deps"
      - "dependabot/**"
  pull_request:
  workflow_dispatch:

concurrency:
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          # gitleaks revisa toda la historia, no solo el último commit
          fetch-depth: 0

      - name: install gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --location --silent --show-error \
               --output gitleaks.tar.gz \
               "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --file gitleaks.tar.gz gitleaks

      - name: scan git history
        run: ./gitleaks git . --config .gitleaks.toml --no-banner --redact --verbose
